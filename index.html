<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Olaniyi Omodolapo — Fullstack Engineer building scalable backends and polished web and AI frontends." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Applies the saved theme before first paint so there is no flash. Dark is the default. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', t !== 'light');
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
